<style>

</style>
</head>
<body>
<header><h1>百人一首ノート</h1><p>単語帳と札流し</p></header>
<nav>
<button class="navbtn" id="bookTab"><span class="symbol">☰</span><span>単語帳</span></button>
<button class="navbtn" id="gameTab"><span class="symbol">□</span><span>札流し</span></button>
</nav>
<main>
<section id="bookSection">
<div class="toolbar">
<label>順番 <select id="order"><option value="normal">通常順</option><option value="kimariji">むすめふさほせ順</option></select></label>
<label>表示 <select id="display"><option value="flip">タップでめくる</option><option value="all">全表示</option></select></label>
</div>
<div class="count" id="bookCount"></div>
<div id="poemList"></div>
</section>
<section id="gameSection" class="hidden">
<div class="panel">
<div class="poemhead"><span id="progress">札流し・100首</span><span class="status" id="gameStatus">待機中</span></div>
<div class="gameverse" id="question">「計測スタート」を押して始めよう</div>
<div class="answer" id="previousAnswer"></div>
<div class="actions">
<button class="primary" id="nextBtn">次へ</button>
<button id="restartBtn">最初から</button>
</div>
<p class="small">次へを押すと次の札が出て、直下にひとつ前の札の決まり字が表示されるよ。</p>
</div>
<div class="panel">
<div class="small">経過時間</div>
<div class="timer" id="timer">00:00.0</div>
<div class="actions">
<button class="primary" id="startBtn">計測スタート</button>
<button id="stopBtn">終了</button>
</div>
</div>
</section>
</main>

let flipped=new Set(), order='normal', display='flip', deck=[], index=0, previous=null, running=false, startAt=0, elapsedBefore=0, timerInterval=null;
const $=id=>document.getElementById(id);
function setSection(which){const isBook=which==='book';bookSection.classList.toggle('hidden',!isBook);gameSection.classList.toggle('hidden',isBook);bookTab.style.background=isBook?'#e7e4da':'white';gameTab.style.background=!isBook?'#e7e4da':'white';}
bookTab.addEventListener('click',()=>setSection('book'));gameTab.addEventListener('click',()=>setSection('game'));
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderBooks(){
 order=$('order').value;display=$('display').value;
 let list=[...poems];
 if(order==='normal')list.sort((a,b)=>a[0]-b[0]);
 else list.sort((a,b)=>kimarijiOrder.indexOf(a[1])-kimarijiOrder.indexOf(b[1]));
 $('bookCount').textContent=`${list.length}首`;
 $('poemList').innerHTML=list.map(p=>{
  const open=display==='all'||flipped.has(p[0]);
  const upper=`<strong>${esc(p[4])}</strong>${esc(p[2].slice(p[4].length))}`;
  return `<article class="poem" data-num="${p[0]}"><div class="poemhead"><span>${p[0]}番　決まり字：${esc(p[1])}</span><span>${display==='all'?'全表示':open?'上の句':'下の句'}</span></div>${open?`<div class="verse">${upper}</div><div class="verse lower">${esc(p[3])}</div>`:`<div class="verse">${esc(p[3])}</div>`}</article>`;
 }).join('');
 if(display==='flip')document.querySelectorAll('.poem').forEach(el=>el.addEventListener('click',()=>{let n=Number(el.dataset.num);flipped.has(n)?flipped.delete(n):flipped.add(n);renderBooks();}));
}
$('order').addEventListener('change',renderBooks);$('display').addEventListener('change',renderBooks);
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderGame(){
 if(!deck.length)return;
 const p=deck[index];
 $('question').textContent=p[3];
 $('previousAnswer').textContent=previous?previous[1]:'';
 $('progress').textContent=`問題 ${index+1} / ${deck.length}`;
}
function newDeck(){deck=shuffle(poems);index=0;previous=null;renderGame();}
$('nextBtn').addEventListener('click',()=>{if(!deck.length)newDeck();previous=deck[index];index++;if(index>=deck.length){deck=shuffle(poems);index=0;}renderGame();});
$('restartBtn').addEventListener('click',()=>{newDeck();});
function formatTime(ms){let t=ms/1000;let m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor((t*10)%10);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`;}
function tick(){let ms=elapsedBefore+(running?Date.now()-startAt:0);$('timer').textContent=formatTime(ms);}
$('startBtn').addEventListener('click',()=>{if(running)return;running=true;startAt=Date.now();$('gameStatus').textContent='計測中';$('startBtn').textContent='計測中…';timerInterval=setInterval(tick,100);});
$('stopBtn').addEventListener('click',()=>{if(running){elapsedBefore+=Date.now()-startAt;running=false;clearInterval(timerInterval);timerInterval=null;$('gameStatus').textContent='終了';$('startBtn').textContent='再開';tick();}else if(elapsedBefore>0){elapsedBefore=0;$('timer').textContent='00:00.0';$('gameStatus').textContent='待機中';$('startBtn').textContent='計測スタート';}});
renderBooks();newDeck();setSection('book');
</script>
</body></html>
